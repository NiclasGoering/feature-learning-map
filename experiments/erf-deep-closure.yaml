id: erf-deep-closure
title: "Deep erf networks at P ∝ N: the nested closure fails"
date: "2026-11-05"
regime: "NTK, P ∝ N (standard scaling, κ = 1/N)"
regime_id: ntk-prop
slot: nonlinear
tests: [S07]
claim: >-
  For deep nonlinear networks, S07 has two closures in the literature, and they disagree for erf.
  Exact posteriors of erf networks with 2–4 hidden layers (P = N/2 and P = N, N ≤ 200) rule out the
  nested closure: its readout norm is 10–22% too large and its test loss up to 12% off, and both gaps
  grow with depth and do not shrink with N. The factorised closure is within 1–2% on the losses.
  The sampled posterior is closest to a third closure, found in this experiment: the nested form with
  the erf linearisation frozen at the NNGP kernel.
formula: >-
  $$\begin{aligned}\text{nested:}\quad & K^{\ell}_R=\rho_\ell\,\Theta\big(K^{\ell-1}_R\big)\\
  \text{factorised:}\quad & K^{L}_R=\textstyle\prod_\ell\rho_\ell\;\Theta^L(C)\\
  \text{linear path:}\quad & K^{\ell}_R=\rho_\ell\big[D_{c_\ell}K^{\ell-1}_RD_{c_\ell}+B_\ell\big]\end{aligned}$$
verdict:
  - {subject: "nested closure (Pacelli et al.)", outcome: "ruled out: 10–22% off in the readout norm, does not shrink with N", tone: refutes}
  - {subject: "factorised closure (equivalent Wishart ansatz, Baglioni et al.)", outcome: "close (losses within 1–2%) but off in the same direction at every depth", tone: mixed}
  - {subject: "linear-path closure (found here)", outcome: "closest at N ≤ 200; the call against factorised needs larger N", tone: confirms}
setup: |-
  - Fully connected erf networks, no biases, all weights $\mathcal N(0,1)$, standard scaling ($\kappa=1/N$), Gaussian likelihood with noise $T=0.05$.
  - $L=2,3,4$ hidden layers, plus $L=1$ as a control (all closures coincide there).
  - $\alpha=P/N=0.5$ and $1$; $N=100$ for every cell (two data sets) and $N=200$ at $\alpha=0.5$. Inputs isotropic Gaussian with $D=N$; 1000 test points.
  - Target: an erf teacher of the same architecture with its readout ×3, so the target is hard ($y^\top K_{\rm GP}^{-1}y/P\approx9$–16).
  - Sampler: HMC in JAX (float64) on the hidden weights with the readout integrated out exactly; 4 chains per run (2 started at the teacher, 2 at random), 300 warm-up + 1000 draws each. R-hat ≤ 1.004 on every observable in all 18 runs; started-at-teacher and random chains agree to 0.5%.
  - Predictions: the saddle of $F(\rho)$ with $K_R$ from Pacelli et al. Eq. 15 (nested), Baglioni et al. Eq. 48 (factorised) or the linear path, whose erf linearisation $c_\ell$ and remainder $B_\ell$ are frozen at the NNGP kernel. Exact finite-$N$ integration moves them by ≤ 0.5%.
numbers: |-
  Readout norm $\rho_L=\langle\lVert v\rVert^2\rangle/N$ and test loss, sampled against the three closures (largest $N$ per cell; Monte-Carlo error ±0.002 and ±0.005):

  | $L$ | $\alpha$ | $N$ | $\rho_L$ sampled | nested | factorised | linear path | test sampled | nested | factorised | linear path |
  |---|---|---|---|---|---|---|---|---|---|---|
  | 1 | 0.5 | 200 | 2.202 | 2.185 | 2.185 | 2.185 | 3.069 | 3.062 | 3.062 | 3.062 |
  | 2 | 0.5 | 200 | 1.911 | 2.121 | 1.846 | 1.873 | 3.039 | 2.962 | 3.066 | 3.031 |
  | 3 | 0.5 | 200 | 1.791 | 2.252 | 1.710 | 1.734 | 2.616 | 2.378 | 2.635 | 2.587 |
  | 4 | 0.5 | 200 | 1.541 | 1.943 | 1.471 | 1.494 | 2.254 | 2.028 | 2.270 | 2.235 |
  | 1 | 1 | 100 | 2.677 | 2.652 | 2.652 | 2.652 | 1.883 | 1.877 | 1.877 | 1.877 |
  | 2 | 1 | 100 | 2.373 | 2.775 | 2.217 | 2.259 | 2.078 | 2.061 | 2.125 | 2.059 |
  | 3 | 1 | 100 | 1.885 | 2.420 | 1.758 | 1.798 | 1.589 | 1.483 | 1.618 | 1.565 |
  | 4 | 1 | 100 | 1.626 | 2.092 | 1.500 | 1.539 | 1.237 | 1.109 | 1.260 | 1.225 |

  Gap in $\rho_L$ from $N=100$ to $N=200$ ($\alpha=0.5$; $L=2,3,4$): nested −9 → −10%, −17 → −21%, −21 → −21% (does not move); factorised +8 → +4%, +9 → +5%, +12 → +5%; linear path +7 → +2%, +8 → +3%, +10 → +3% (both roughly halve, as a $1/N$ correction would).

  Hidden preactivation variances stay at their NNGP values (+0.3 to +3% at $N=200$, $L=4$, shrinking with $N$); the nested closure needs them to rise by 18–91%.

  Posterior-mean predictor on the line from the factorised ($t=0$) to the nested ($t=1$) predictor, $N=200$, $L=2,3,4$: sampled $t=-0.51,-0.56,-0.58$; linear path $-0.54,-0.59,-0.61$. Both papers err in the same direction from the sampled predictor, the nested one about three times further.
figures:
  - {file: gap-vs-depth.png, caption: "Relative gap (sampled − predicted)/predicted against depth for the three closures: readout norm, train and test loss. Top: α = 0.5, N = 200; bottom: α = 1, N = 100."}
  - {file: predictor-position.png, caption: "The sampled posterior-mean predictor on the axis from the factorised (t = 0) to the nested (t = 1) prediction sits on the linear-path value (green line), not at either paper's closure."}
caveats:
  - "Small widths: N ≤ 200, and α = 1 only at N = 100. Larger runs stalled when the machine ran out of memory; the factorised and linear-path gaps halve from N = 100 to 200, but the extrapolation rests on two widths."
  - "Factorised and linear path differ by only ~1.5% in the readout norm; separating them rests mainly on the posterior-mean predictor and the train loss. The nested verdict is robust."
  - "The linear-path closure was derived in this experiment and is not published; it is exact for a Gaussian-equivalent surrogate of each layer, and its claim to describe the network rests on these numerics."
  - "One target type, one temperature (T = 0.05), isotropic Gaussian inputs with D = N; structured data not tested."
  - "At L = 1, where all closures coincide, the readout norm is still 1% above the theory at N = 100–200: the generic finite-width effect."
status_note: "Run for the map (exact HMC, 18 runs); not peer reviewed. The linear-path closure is new here."
