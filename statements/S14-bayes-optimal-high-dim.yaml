id: S14
slug: bayes-optimal-high-dim
title: "High-dimensional Bayes-optimal error, and when GD reaches it"
kind: grouping
claim: "In the high-dimensional limit the Bayes-optimal error of teacher–student models is a variational formula over a finite overlap matrix (replica-symmetric; proved for generalised linear models). Gradient training reaches it in easy cases; in hard ones only with averaging, batch reuse, tuned regularisation or width."
formula: '$$q^*=\operatorname*{argmax}_q\ \inf_r\Big[\psi_{P_0}(r)+\alpha\,\Psi_{P_{\rm out}}(q;\rho_0)-\tfrac12rq\Big],\qquad \mathrm{MMSE}=\rho_0-q^*,\quad\alpha=\tfrac PD$$'
regime:
  width_limit: high-dim
  learning_rule: [bayes, gd]
  conditions: "Teacher–student, $P\\sim D^k$ ($k=1$: GLMs, multi-index, deep random targets via Gaussian equivalence; $k=2$: quadratic nets, attention). $\\mathrm{MMSE}=\\rho_0-q^*$ needs no sign symmetry; continuous channels need $\\Delta>0$. Averaging lowers GD only to the metastable universal branch once specialisation is the equilibrium. Members are outside the core: placed, not collapsed."
status: phys
status_note: "Proved for generalised linear models (Barbier et al. 2017); replica/AMP physics for the others; the GD comparisons are numerical."
members:
  - paper: "1708.03395"
    result: r5
    statement: "Teacher-student GLM $y_\\mu=\\varphi(x_\\mu^\\top w^*/\\sqrt D,a_\\mu)$ at $P/D=\\alpha$: against the proved Bayes-optimal error (Eq. 9) and GAMP (Eq. 10), hand-tuned logistic regression nearly matches it for Gauss-Bernoulli weights but misses perfect generalisation near $\\alpha_{\\rm AMP}\\approx1.493$ for binary weights; a two-hidden-layer RMSprop-trained net learns the symmetric door only approximately."
    mapping: "Paper $n\\to D$, $m\\to P$, $\\alpha=m/n\\to P/D$ (not the umbrella $P/N$), $\\Phi\\to X$, $X^*\\to w^*$, $\\rho=\\mathbb E X^{*2}\\to\\rho_0$; $q$ is the scalar teacher overlap; no hidden layer on the Bayes side."
    equations: "Fig. 2, Sec. 3.4, SI F.1 (comparison)"
    role: check
  - paper: "2302.00375"
    result: r2
    statement: "Deep random target, Gaussian inputs, $P,D,N_\\ell\\to\\infty$ proportionally: the Bayes MSE (Eqs. 12-13, scalar RS overlap $q$) equals that of a noisy linear target (Eq. 16); ridge at $\\lambda^*=\\epsilon_r/\\rho$ (Eq. 21) and kernel ridge (Eq. 25) reach it; logistic and ridge classification lie $10^{-4}$, $10^{-3}$ above Eq. (15)."
    mapping: "$n\\to P$, $d\\to D$, $k_\\ell\\to N_\\ell$ (target widths), $\\alpha=n/d\\to P/D$; paper $\\rho=\\Delta_a\\prod(\\kappa_1^{(\\ell)})^2\\Delta_\\ell$ is a signal strength, not the umbrella $\\rho$; $\\kappa_1,\\kappa_*$ Hermite coefficients, not $\\kappa$; $\\epsilon_r$ residual noise (Eq. 14)."
    equations: "Eqs. (12)-(16), Sec. 3.3; Eqs. (19)-(21), (24)-(25), Secs. 4.1-4.4; Figs. 2-4"
