  - {target: S13, relation: unrelated, note: "Both flows are called RG. S13 integrates out kernel eigenmodes above $k_T$ at $N=\\infty$, $P$ a parameter (ridge $\\eta_{\\rm eff}$ rises). Here $P$ itself is the flow variable, acting on the parameters of one model; no kernel spectrum enters."}
