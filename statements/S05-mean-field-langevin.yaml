id: S05
slug: mean-field-langevin
title: "Mean-field Langevin: the proximal Gibbs measure"
kind: collapse
claim: "For a loss convex in the neuron measure the entropy-regularised mean-field problem has a unique minimiser, its own proximal Gibbs measure. Langevin dynamics converges to it under a log-Sobolev inequality, and the $N$-neuron Gibbs posterior is $O(1)$ in KL from $\\hat\\nu^{\\otimes N}$."
formula: '$$\hat\nu\ \propto\ \nu_0\,\exp\!\Big(-\tfrac1T\,\tfrac{\delta\mathcal L}{\delta\nu}[\hat\nu]\Big),\qquad \hat\nu=\arg\min_\nu\ \mathcal F_T[\nu]=\mathcal L[\nu]+T\,\mathrm{KL}(\nu\Vert\nu_0)$$'
formula_note: "$-\\frac1N\\log Z_N=\\frac1T\\min\\mathcal F_T+O(1/N)$ for $Z_N$ normalising $\\nu_0^{\\otimes N}e^{-\\frac NT\\mathcal L}$ (Chen–Ren–Wang Thm 2.6 at stationarity). The constant is $LR^2/2N$ for a loss averaged over data, $P$ times larger for a summed loss."
regime:
  width_limit: inf-meanfield-fixedP
  learning_rule: [bayes]
  conditions: "Two-layer network, bounded neurons and loss derivative (Nitanda–Wu, Chizat, Hu), or a truncated readout (Chen–Ren–Wang); $P$ fixed; $T>0$; likelihood scaled with $N$. Prior variance $\\propto T$ in Nitanda–Wu, Chizat, Chen–Ren–Wang, Kook, Nitanda (cold convention); Hu and Takakura temper the likelihood only. A trainable Gaussian readout is outside the hypotheses, except Takakura’s two-timescale dynamics."
status: thm
status_note: "All proved. Chen–Ren–Wang, Kook et al., Nitanda 2024 and Chewi–Nitanda reach the finite-$N$ Gibbs posterior; Hu–Ren, Nitanda–Wu, Chizat treat the $N=\\infty$ dynamics. Takakura’s profiled stationary law differs from the posterior by $\\det(K_W+\\eta I)^{-1/2}$."
members:
  - paper: "1905.07769"
    result: r2
    statement: "For $\\mathcal L$ convex, $C^1$ and bounded below on $\\mathcal P(\\mathbb R^d)$ and $\\nu_0=e^{-U}$ with $U$ smooth, coercive and $\\nabla U$ Lipschitz, $\\mathcal F_T=\\mathcal L+T\\,\\mathrm{KL}(\\nu\\Vert\\nu_0)$ has a unique minimiser $\\nu^*\\in\\mathcal P_2$, and $\\nu$ minimises iff $\\nu\\propto\\nu_0\\exp(-\\frac1T\\frac{\\delta\\mathcal L}{\\delta\\nu}[\\nu])$."
    mapping: "$m\\to\\nu$, $F\\to\\mathcal L$, $\\sigma^2/2\\to T$, Gibbs measure $g=e^{-U}\\to\\nu_0$ (fixed, independent of $T$, so $T$ is the map's $T=1/\\beta$), $H\\to\\mathrm{KL}(\\cdot\\Vert\\nu_0)$, $V^\\sigma\\to\\mathcal F_T$, $\\frac{\\delta F}{\\delta m}\\to\\frac{\\delta\\mathcal L}{\\delta\\nu}$."
    equations: "Prop. 2.5, Eq. (2.4); objective Eq. (2.1); Ass. 2.1-2.2"
    role: master
  - paper: "1905.07769"
    result: r1
    statement: "If $D_m\\mathcal L$ is bounded and Lipschitz in $(x,W_2)$ (Ass. 2.7) and $\\nu_{t=0}\\in\\mathcal P_p$, $p>2$, the marginals of $dX_t=-(D_m\\mathcal L(\\nu_t,X_t)+T\\nabla U(X_t))dt+\\sqrt{2T}dW_t$ converge in $W_2$ to $\\nu^*$, without a rate; for networks only with a truncated readout (Cor. 3.3)."
    mapping: "$\\sigma\\,dW\\to\\sqrt{2T}\\,dW$, $m_t\\to\\nu_t$, $m^*\\to\\nu^*$; network $\\hat\\varphi=\\ell(\\beta)\\varphi(\\alpha\\cdot z)$, $\\ell\\in C_b^\\infty$ truncation, $\\varphi\\in C_b^\\infty$, so $(\\beta,\\alpha)\\to(a,w)$ with $a$ entering only through bounded $\\ell(a)$."
    equations: "Thm 2.11; SDE Eq. (2.5); Ass. 2.1, 2.2, 2.7; Cor. 3.3 with Ass. 3.2"
    role: rate
  - paper: "1905.07769"
    result: r4
    statement: "Along mean-field Langevin dynamics, $\\mathcal F_T(\\nu_t)-\\mathcal F_T(\\nu_s)=-\\int_s^t\\!\\int|D_m\\mathcal L(\\nu_r,x)+T\\nabla\\log\\nu_r+T\\nabla U|^2\\,d\\nu_r\\,dr$ for all $t>s>0$, so $\\mathcal F_T$ decreases (Thm 2.9, Eq. 2.7)."
    mapping: "$V^\\sigma\\to\\mathcal F_T$, $\\frac{\\sigma^2}{2}\\to T$, $\\frac{\\nabla m_r}{m_r}\\to\\nabla\\log\\nu_r$; hypotheses Ass. 2.2 and 2.7 (not convexity)."
    equations: "Thm 2.9, Eq. (2.7); proof Sec. 6 (Lemmas 6.1-6.5)"
    role: rate
  - paper: "1905.07769"
    result: r5
    statement: "If $\\mathcal L$ is weakly continuous, $\\mathcal F_T$ $\\Gamma$-converges to $\\mathcal L$ as $T\\downarrow0$, so $\\mathcal L[\\nu^*_T]\\to\\inf_{\\mathcal P_2}\\mathcal L$ and cluster points of $\\nu^*_T$ minimise $\\mathcal L$ (Prop. 2.3)."
    mapping: "$\\sigma\\downarrow0\\to T\\downarrow0$ at fixed $\\nu_0$ (map's convention); $m^{*,\\sigma}\\to\\nu^*_T$."
    equations: "Prop. 2.3 (proof Sec. 4)"
    role: rate
  - paper: "1905.07769"
    result: r3
    statement: "At $T=0$: if the first and second linear derivatives of $\\mathcal L$ are bounded by $L_2$ in the sense of Eq. (2.3) and $\\mathcal L$ has a minimiser, then $0\\le\\inf_{x_1..x_N}\\mathcal L[\\frac1N\\sum_i\\delta_{x_i}]-\\min\\mathcal L\\le 2L_2/N$ (Thm 2.4)."
    mapping: "$F\\to\\mathcal L$, $L\\to L_2$ (a derivative bound, not depth), $N$ neurons; no entropy and no Gibbs measure."
    equations: "Thm 2.4, Eq. (2.3); proof Eqs. (4.3)-(4.5)"
    role: rate
  - paper: "2201.10469"
    result: r1
    statement: "If $\\mathcal L$ is convex with $\\frac{\\delta\\mathcal L}{\\delta\\nu}=O(1+\\Vert\\theta\\Vert^2)$ uniformly (Ass. 1) and every $\\hat\\nu[\\nu]$ satisfies an LSI with constant $\\alpha$ (Ass. 2), then for any $T>0$ $\\mathcal F_T(\\nu_t)-\\mathcal F_T^*\\le e^{-2\\alpha Tt}(\\mathcal F_T(\\nu_0)-\\mathcal F_T^*)$ (Thm 1), and $\\inf_{s\\le t}\\mathrm{KL}(\\nu_s\\Vert\\hat\\nu_s)$ decays alike (Cor. 1)."
    mapping: "$q\\to\\nu$, $p_q\\to\\hat\\nu[\\nu]$, $\\lambda\\to T$, $\\alpha\\to C_{\\rm LSI}$ ($\\mathrm{Ent}(g^2)\\le\\frac2\\alpha\\mathbb E|\\nabla g|^2$); $F$ includes $\\lambda'\\Vert\\theta\\Vert^2$, so $\\nu_0=\\mathcal N(0,\\frac{T}{2\\lambda'}I)$, variance $\\propto T$; $\\mathcal L(q)=\\mathcal F_T+$ const; $M\\to N$."
    equations: "Thm 1; Ass. 1-2; Eqs. (6)-(9); Cor. 1; App. A.1 (LSI constant)"
    role: rate
  - paper: "2201.10469"
    result: r3
    statement: "The minimiser is its own proximal Gibbs measure, $\\nu^*=\\hat\\nu[\\nu^*]\\propto\\exp(-\\frac1T\\frac{\\delta F}{\\delta\\nu}[\\nu^*])$ (Eq. 15, credited to Hu et al.); for every $\\nu$, $T\\,\\mathrm{KL}(\\nu\\Vert\\hat\\nu[\\nu])\\ge\\mathcal F_T(\\nu)-\\mathcal F_T^*\\ge T\\,\\mathrm{KL}(\\nu\\Vert\\nu^*)$ (Prop. 1.3), a PL and quadratic-growth pair."
    mapping: "$\\exp(-\\frac1\\lambda\\frac{\\delta F}{\\delta q})$ with $F$ = loss + $\\lambda'\\Vert\\theta\\Vert^2$ equals $\\nu_0\\exp(-\\frac1T\\frac{\\delta\\mathcal L}{\\delta\\nu})$ with $\\nu_0=\\mathcal N(0,\\frac T{2\\lambda'}I)$; $\\lambda\\to T$, $\\mathcal L(q)\\to\\mathcal F_T$."
    equations: "Def. 1 Eq. (5); Eq. (15); Prop. 1 (items 1-3, Eq. 16)"
    role: rate
  - paper: "2201.10469"
    result: r2
    statement: "For the time-discretised mean-field dynamics ($N=\\infty$) with step $h$ and one-step error $\\delta_h$, $\\mathcal F_T(\\nu^{(k)})-\\mathcal F_T^*\\le\\frac{\\delta_h}{2\\alpha T}+e^{-\\alpha Thk}(\\mathcal F_T(\\nu^{(0)})-\\mathcal F_T^*)$ (Thm 2); for smooth bounded-gradient networks $\\delta_h=O(h)$ (Lemma 1), so $O(\\frac1{\\epsilon\\alpha^2T^2}\\log\\frac1\\epsilon)$ iterations reach accuracy $\\epsilon$ (Cor. 2)."
    mapping: "Paper step size $\\eta\\to h$ (not the umbrella $\\eta$); $\\lambda\\to T$; $\\alpha\\to C_{\\rm LSI}$; Lemma 1 needs $|\\partial_z\\ell|\\le C_1$, $\\Vert\\partial_\\theta h_\\theta\\Vert\\le C_3$ and $2\\lambda'h<1$."
    equations: "Thm 2; Lemma 1 Eqs. (21)-(22); Cor. 2 Eq. (23)"
    role: rate
  - paper: "2201.10469"
    result: r4
    statement: "For regularised empirical risk with convex differentiable loss, the duality gap between $\\nu$ and its residual vector $g_\\nu=(\\partial_z\\ell(f_\\nu(x_\\mu),y_\\mu))_\\mu$ equals $T\\,\\mathrm{KL}(\\nu\\Vert\\hat\\nu[\\nu])$ (Thm 3); with $C_2$-smooth loss and $|h_\\theta|\\le B$, $\\mathcal F_T(\\hat\\nu[\\nu])-\\mathcal D(g_\\nu)\\le(T+2B^2C_2)\\mathrm{KL}(\\nu\\Vert\\hat\\nu[\\nu])$ (Thm 4)."
    mapping: "$\\hat\\nu[\\nu]\\propto\\exp(-\\frac1T(\\frac1P\\sum_\\mu g_\\mu h_\\theta(x_\\mu)+\\lambda'\\Vert\\theta\\Vert^2))$; $n\\to P$; for the square loss $g_\\nu=f_\\nu-y=-\\eta v$ with $\\eta=TP$; $\\mathcal D$ is the dual of Eq. (25)."
    equations: "Eqs. (24)-(25); Thm 3; Thm 4; Cor. 3"
    role: rate
  - paper: "2202.01009"
    result: r1
    statement: "If $\\nabla\\frac{\\delta\\mathcal L}{\\delta\\nu}$ is jointly Lipschitz in $x$ and $W_2$ (Ass. 1), $\\mathcal L$ is convex with a minimiser (Ass. 2) and every $\\hat\\nu[\\nu]$ satisfies LSI($\\rho_T$) (Ass. 3), then $\\mathcal F_T(\\nu_t)-\\mathcal F_T^*\\le e^{-2T\\rho_Tt}(\\mathcal F_T(\\nu_0)-\\mathcal F_T^*)$; $\\mathrm{KL}(\\nu_t\\Vert\\nu^*)$ and $W_2^2$ decay alike."
    mapping: "$\\mu\\to\\nu$, $\\tau\\to T$, $G\\to\\mathcal L$ + weight decay $\\frac\\lambda2\\Vert x\\Vert^2$, so $\\nu_0=\\mathcal N(0,\\frac T\\lambda I)$ (variance $\\propto T$); $e^{-V[\\mu]/\\tau}\\to\\hat\\nu[\\nu]$; $\\rho_\\tau\\to C_{\\rm LSI}$ ($H\\le I/2\\rho$); $m\\to N$; $H$ = entropy against Lebesgue."
