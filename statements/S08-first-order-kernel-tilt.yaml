id: S08
slug: first-order-kernel-tilt
title: "First order in $1/N$: energy tilt and log-determinant tilt"
kind: collapse
claim: "At large width and fixed $P$ the posterior kernel and predictor shift at first order by an energy tilt along the target (shared with small-$\\kappa$ μP) and a log-determinant tilt; the predictor also has a prior mean shift and a fluctuation term."
formula: '$$\delta K^L=\tfrac{\kappa}{2}\,\mathrm{Cov}_0\!\big(\varphi\varphi^\top,(v^\top\varphi)^2\big)\;-\;\tfrac{D_{\rm out}}{2N}\,\mathrm{Cov}_0\!\big(\varphi\varphi^\top,\ \varphi^\top(K^L+\eta I)^{-1}\varphi\big),\qquad v=(K^L+\eta I)^{-1}y$$'
formula_note: "One hidden layer. Deep: replace $\\mathrm{Cov}_0$ by the prior covariance of $K^\\ell$ with $K^L$ (every layer moves at $O(1/N)$), plus the forward term $\\frac{dK^\\ell_{\\rm GP}}{dK^{\\ell-1}}[\\delta K^{\\ell-1}]$ for $\\ell\\ge2$ (missing from Lauditi Eq. 60). $D_{\\rm out}=1$ on the Overview."
regime:
  width_limit: large-width-1/N
  learning_rule: [bayes]
  conditions: "$P$ fixed, $L/N$ small, standard scaling $\\kappa=1/N$ (both terms $O(1/N)$); $LP/N$ small for deep members (Hanin–Zlokapa). In μP at small $\\gamma_0$ only the energy tilt appears ($\\kappa=\\gamma_0^2$). At $P\\propto N$ keep the log-det part and the predictor’s fluctuation term, or use readout variables. Naveh–Ringel resums the tilt at large $P$."
status: phys
status_note: "Physics. Energy tilt common to Lauditi’s small-$\\gamma_0$, Naveh–Ringel, Seroussi, Fischer, Roberts–Yaida; log-det tilt in Seroussi, Fischer, Yaida, Roberts–Yaida, Zavatone-Veth–Canatar (a conjecture, derived for deep linear); all four predictor terms only in Yaida."
