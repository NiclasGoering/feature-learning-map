id: S07
slug: nonlinear-proportional
title: "Nonlinear networks at $P\\propto N$: a readout-side Wishart functional"
kind: collapse
claim: "Under Gaussian equivalence the posterior of nonlinear networks at $P\\propto N$ reduces to a readout-side functional of a fixed-size Wishart order parameter: a scalar per layer, or a matrix over outputs, patches, gates, replicas or attention paths. One scalar rescales the NNGP kernel."
formula: '$$F_B(\rho)=j(\rho)+\kappa\,\tfrac12\,y^\top\big(\rho K_{\rm GP}+\eta I\big)^{-1}y+\tfrac1{2N}\log\det\big(\rho K_{\rm GP}+\eta I\big),\quad j(\rho)=\tfrac12(\rho-1-\ln\rho)$$ one hidden layer, $\kappa=\tfrac1N$, $\eta=0$: $\ \rho^2+(\alpha-1)\rho-\alpha\bar r=0$'
regime:
  width_limit: finite-proportional
  learning_rule: [bayes]
  conditions: "One hidden layer (deep: nested or factorised closure, equal for degree-one homogeneous $\\varphi$); Gaussian equivalence, guaranteed only for $P=O(\\sqrt D)$ at Hermite rank 1 ($P=1000$, $D\\le1024$ runs suggest the bound is pessimistic); finite-mean $\\varphi$ (ReLU) needs two scalars, so scalar ReLU results are approximate. At $T>0$ the order parameter moves the mean through $\\eta/\\rho$ or the ridge $\\eta Q^{-1}$."
status: phys
status_note: "Physics: exact once Gaussian equivalence is assumed. Tiberi et al. (softmax attention, fixed $Q,K$) are exact without GE because the network is linear in the values."
members:
  - paper: "2209.04882"
    result: r1
    statement: "One hidden layer, zero-mean $\\varphi$, Gaussian equivalence, any $T$: $-\\frac1N\\log Z\\to\\min_\\rho F_B(\\rho)$, $F_B=j(\\rho)+\\frac1{2N}y^\\top(\\rho K^1_{\\rm GP}+\\eta I)^{-1}y+\\frac1{2N}\\log\\det(\\rho K^1_{\\rm GP}+\\eta I)$, $j=\\frac12(\\rho-1-\\ln\\rho)$, after eliminating the dual by $\\bar Q=1/(1+Q)$; mean $k^\\top(K^1_{\\rm GP}+\\frac\\eta\\rho I)^{-1}y$."
    mapping: "$\\bar Q\\to\\rho$; $Q\\to1/\\rho-1$; $K/\\lambda_1\\to K^1_{\\rm GP}$; $T=1/\\beta\\to\\eta$; $\\alpha_1/P=1/N_1\\to\\kappa$; $\\frac12S\\to F_B$ + const ($P\\log\\beta$); $\\kappa_\\mu/\\lambda_1\\to k$. Under GE $\\rho$ is the readout norm $\\lambda_1\\Vert v\\Vert^2/N$ (pilot derivation, not in the paper)."
    equations: "Eqs. (6)-(7), Sec. II A; Methods C-E Eqs. (47)-(49), (56)"
    role: master
  - paper: "2209.04882"
    result: r2
    statement: "At $T=0$: $\\rho^2+(\\alpha-1)\\rho-\\alpha\\bar r=0$, $\\rho^*=\\frac12[\\sqrt{(\\alpha-1)^2+4\\alpha\\bar r}-(\\alpha-1)]$; the mean is the NNGP mean and the variance is $\\rho^*$ times the NNGP variance, so finite width helps iff $\\bar r<1$. At $T>0$ the mean is $k^\\top(K^1_{\\rm GP}+\\frac\\eta\\rho I)^{-1}y$ and moves."
    mapping: "$\\bar Q^*\\to\\rho^*$; $s=\\frac1Py^\\top(K/\\lambda_1)^{-1}y\\to\\bar r$; $\\alpha_1\\to\\alpha$; $\\kappa_\\mu/\\lambda_1\\to k$, $\\kappa_0/\\lambda_1\\to k_{**}$; $\\lambda_1T/\\bar Q$ (in units of $K$) $\\to\\eta/\\rho$ (in units of $K^1_{\\rm GP}$)."
