    relation: reproduces
    note: "Integrating $d\\eta_c/dc=1$ from the bare ridge $\\eta$ to the stop gives S13's $\\eta_{\\rm eff}=\\eta+\\sum_{k>k_T}\\lambda_k$, $P\\lambda_{k_T}=\\eta_{\\rm eff}$, in S13's symbols (Howard: $\\sigma^2,\\sigma_c^2,\\eta,\\kappa\\to\\eta,\\eta_{\\rm eff},P,k_T$). S13 also holds the non-Gaussian $W_c(x)$ flow."
  - target: S01
