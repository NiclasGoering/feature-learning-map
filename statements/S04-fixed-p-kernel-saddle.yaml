  - paper: "2505.08062"
    result: r2
    statement: "Standard scaling (fixed noise precision $\\beta$): the exact kernel posterior tilts the prior by $e^{-\\frac12\\Psi}$, $\\Psi=2E(K^L)+\\log\\det(I+\\beta K^L)$, which is of order one, so the posterior LDP at speed $N$ has the prior rate $\\sum_\\ell m_\\ell J_\\ell$: the kernels stay lazy ($\\kappa=1/N$)."
    mapping: "$\\kappa=\\gamma^2/N=1/N$ ($\\gamma=1$), $\\eta=1/\\beta$; $\\Sigma(K^{L+1})=K^L\\otimes1_D$; $\\beta y^\\top(1+\\beta\\Sigma)^{-1}y=y^\\top(\\Sigma+\\eta I)^{-1}y=2E$; tilt enters Prop. A.5 as $\\Phi_0=0$, $\\rho=\\tfrac12\\Psi$."
    equations: "Prop. 4.1 (with Eq. (16) and $\\Psi$), proof in Sec. 7.5; Prop. 4.2"
    role: special-case
  - paper: "2505.08062"
