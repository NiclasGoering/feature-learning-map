    mapping: "As result 1 with $P=1$: $I(\\sqrt\\kappa\\,y)=F$ at $\\eta=0$, $P=1$; $q\\to K^{\\ell-1}$, $y\\to$ the layer kernel value $(g-C_b)/C_W$."
