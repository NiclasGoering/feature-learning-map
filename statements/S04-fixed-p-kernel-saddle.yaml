id: S04
slug: fixed-p-kernel-saddle
title: "Fixed $P$: kernel large deviations and the saddle $F$"
kind: collapse
claim: "At fixed $P$ and large width, $-\\frac1N\\log Z\\to F=\\min\\sum_\\ell J_\\ell+\\kappa E$: the prior kernels have rate $\\sum_\\ell J_\\ell$; standard scaling ($\\kappa\\to0$) leaves them in place (lazy), while $\\kappa=O(1)$ (mean field, μP) selects data-dependent kernels."
formula: '$$F=\min_{K^1,\dots,K^L}\ \sum_{\ell=1}^{L}\gamma_\ell J_\ell\big(K^\ell\mid K^{\ell-1}\big)+\kappa\,\tfrac12\,y^\top\big(K^L+\eta I\big)^{-1}y,\qquad J_\ell(K|K^\prime)=\min\{\mathrm{KL}(\nu\Vert\mathcal N(0,K^\prime)):\sigma_\ell^2\,\mathbb E_\nu\varphi\varphi^\top=K\}$$'
formula_note: "$\\gamma_\\ell=\\lim N_\\ell/N$ (1 for equal widths). $D_{\\rm out}=O(1)$ outputs share the kernel; for $D_{\\rm out}\\sim N$ the term $\\frac\\kappa2D_{\\rm out}\\log\\det(K^L+\\eta I)$ stays at the same order."
regime:
  width_limit: inf-meanfield-fixedP
  learning_rule: [bayes]
  conditions: "$P$ fixed; Gaussian prior; $\\kappa=\\gamma^2/N$ (standard $\\gamma_0^2/N$, μP $\\gamma_0^2$). Prior rate: bounded $\\varphi$ (Macci) or linear growth incl. ReLU, GELU (Vogel). Posterior: $\\eta>0$ (Andreis Prop. 4.3, $\\varphi^2\\le A(1+|x|^r)$, $r<2$; Papagiannouli $\\eta=1$; ReLU by combining Vogel with Papagiannouli Lemma B.1)."
status: phys
status_note: "Proved: prior rate; lazy posterior at $\\kappa=1/N$; kernel-selecting posterior at $\\kappa=1$, $\\eta>0$. Physics: deep $\\eta=0$ forms and the tilted single-site law (Lauditi, Rubin, Bauer). Deep kernel machines are $F$ plus an order-one log-determinant (extension)."
members:
  - paper: "2401.01611"
    result: r1
    statement: "Prior LDP at speed $N$: $Z/\\sqrt N$ has rate $I(z)=\\inf_{K^1..K^L}\\{\\sum_\\ell\\gamma_\\ell J_\\ell(K^\\ell|K^{\\ell-1})+\\tfrac12\\mathrm{tr}\\,z^\\top(K^L)^{-1}z\\}$, bounded continuous $\\varphi$. Hence $I(\\sqrt\\kappa\\,y)=F$ at $\\eta=0$, as a prior ball probability; the kernels alone have rate $\\inf\\sum_\\ell\\gamma_\\ell J_\\ell$."
    mapping: "$v_n^*=n_{\\hat\\ell}\\to N$ (smallest width); $\\gamma_\\ell=\\lim N_\\ell/N\\in[1,\\infty]$ weights $J_\\ell$; $\\kappa^*((g-C_b1)/C_W;g')\\to J_\\ell$ (Cramér form); $g^{(\\ell)}\\to K^\\ell$ with bias; $Z/\\sqrt N=\\sqrt\\kappa\\,y$, i.e. $\\gamma^2=\\kappa N$."
    equations: "Thm 2.1, Eqs. (5)-(12); Lemma 3.3 (Eq. 14); Prop. 3.1; Remark 2.3; Remark 3.1"
    role: special-case
  - paper: "2401.01611"
