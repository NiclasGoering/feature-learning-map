    mapping: "Output $f=s/\\sqrt N$ ($\\gamma=\\sqrt N$, $\\kappa=1$), $\\beta_{\\rm umb}=N\\beta$, $\\eta=1/\\beta$; $\\Psi_N=2NE+\\log\\det(I+\\beta\\Sigma)$; correct tilt $\\Phi_0=\\tfrac\\beta2y^\\top(1+\\beta\\Sigma)^{-1}y=E$, $\\rho=\\tfrac12\\log\\det$; $\\mathcal I_0=F$; $D$ outputs add their energies."
