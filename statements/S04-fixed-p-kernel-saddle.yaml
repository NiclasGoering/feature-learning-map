  - paper: "2401.01611"
    result: r4
    statement: "$L=1$: $\\frac1{\\sqrt N}\\partial^{s}Z$ (output, $s=0$, or first input derivative, $s=1$) has an LDP at speed $N$ with rate $\\inf\\{\\sum_hI_h(y_h)+\\Upsilon^*(f):y_h+f_{\\alpha h}=z_{\\alpha h}\\}$ (Cramér), and an MDP, whenever $\\Upsilon$ is finite near 0 (linear growth suffices). For $s=0$ this is Eq. (10) at $L=1$."
    mapping: "$I_h$ = output-bias cost $y^2/(2C_b)$; $\\Upsilon^*$ = Cramér transform of $\\sqrt{C_W}\\,\\hat W\\varphi(\\cdot)$; $n\\to N$; for $s=0$, $\\Upsilon^*\\square I_h=\\inf_K\\{J_1+\\tfrac12 z^\\top K^{-1}z\\}$, i.e. $F$ at $L=1$, $\\eta=0$."
    equations: "Props. 5.1-5.3, Eqs. (17)-(20); Examples 5.1-5.3"
    role: special-case
  - paper: "2405.16958"
