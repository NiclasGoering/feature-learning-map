    note: "Adds to the shell-by-shell ridge flow of S16 a rescaling step (relevance, scaling intervals) and a quartic vertex whose self-energy shifts $r$; with $U=0$ the equivalent-kernel ridge does not flow, so this flow is vertex-driven."
  - target: S02
