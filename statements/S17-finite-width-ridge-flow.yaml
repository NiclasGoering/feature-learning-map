  - target: S01
    relation: extends
    note: "At $U=0$ the theory is S01's regression in equivalent-kernel form, mean $\\bar f_k=\\lambda_ky_k/(\\lambda_k+\\eta/P)$, averaged over data with the ridge fixed at $\\eta$; the quartic vertex is the added ingredient."
  - target: S15
