    statement: "With one variance $s$ shared by readout weights, readout bias and noise, $s\\sim\\mathcal{IG}(a,b)$, the infinite-width posterior is $\\mathbb E_{s\\mid y}\\mathrm{GP}$ with prior $\\mathcal N(0,sK)$, noise $sI$, $s\\mid y\\sim\\mathcal{IG}(a+\\tfrac P2,b+\\tfrac12y^\\top(K+I)^{-1}y)$: a Student-$t_{2a+P}$ with mean $K(K+I)^{-1}y$ and scale $\\tfrac{2b+y^\\top(K+I)^{-1}y}{2a+P}K(K+I)^{-1}$."
    mapping: "$K=K^L_{\\rm GP}$ with readout variance one, incl. bias $\\mathbf 1\\mathbf 1^\\top$ (paper $K'$, Eq. 10); $k\\to P$, $n_{\\min}\\to N$; paper $L$ layers $=L+1$; the mixing is over the hyperprior, at infinite width; $\\eta=s$ moves with the kernel scale."
