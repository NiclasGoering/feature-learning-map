id: S03
slug: posterior-gp-mixture
title: "Posterior: an evidence-tilted mixture of GP posteriors"
kind: collapse
claim: "The exact posterior of a deep linear network (one nonlinear layer under Gaussian equivalence) is a mixture of GP posteriors over a random scale with an evidence-tilted mixing law; so is a posterior with a hyperprior on the output variance or heavy-tailed weights."
formula: '$$p(f_*\mid y)=\int \pi(ds\mid y)\ \mathrm{GP}_s(f_*\mid y),\qquad \pi(ds\mid y)\propto\pi(ds)\,\mathcal N\big(y;0,\,s\,K^0+\eta I\big)$$'
regime:
  width_limit: finite-exact
  learning_rule: [bayes]
  conditions: "$s$: product of independent $\\chi^2_{N_\\ell}/N_\\ell$ for linear networks, exact for $N_\\ell>D_{\\rm out}$, $P<D$ (invertible Gram), any $L,\\beta$; several outputs: a matrix scale. A hyperprior on the output variance mixes only the covariance (the mean stays the NNGP mean); heavy-tailed weights at infinite width give a random $P\\times P$ kernel."
status: thm
status_note: "Proved for deep linear networks (Hanin–Zlokapa at $\\eta=0$; Bassetti–Gherardi for multi-output and $\\beta$ finite), for the Student-$t$ and heavy-tailed limits (Caporali–Favaro, Apollonio–Franzina); physics under Gaussian equivalence (Pacelli)."
members:
  - paper: "2212.14457"
    result: r1
    statement: "Deep linear network, any $P\\le D$, $N_\\ell$, $L$, $\\eta=0$: predictive law (3.1), evidence (3.2), mean $\\theta_*^\\top x$ (3.3) and variance (3.4) are Meijer-G functions of $\\|\\theta_*\\|^2/4M$; via Lemma 4.8 (products of Gamma variables) this is the S03 mixture $Z\\propto\\mathbb E_s[s^{-P/2}e^{-\\|\\theta_*\\|^2/2s}]$, $s\\propto\\prod_\\ell\\chi^2_{N_\\ell}/N_\\ell$."
    mapping: "$N_0\\to D$; $\\|\\theta_*\\|^2=y^\\top(X^\\top X)^{-1}y$ $=y^\\top(K^0)^{-1}y$ with $K^0=X^\\top X$; $\\nu=\\|\\theta_*\\|^2/\\alpha_0=\\sigma^{2(L+1)}\\bar r$; $4M=\\prod_{\\ell=0}^L2\\sigma^2/N_\\ell$; $\\eta=0$, no condition between $N_\\ell$ and $P$."
    equations: "Thm 3.1, Eqs. (3.1)-(3.4); Lemmas 4.6-4.8, Eqs. (4.31)-(4.33)"
    role: master
  - paper: "2111.11954"
    result: r1
    statement: "For a deep linear net with $N_\\ell\\ge D_{\\rm out}$ and invertible $K^0$, the posterior predictive is $\\mathbb E_{s\\sim\\pi(\\cdot\\mid y)}\\mathrm{GP}_s$ with prior $\\mathcal{MN}(0,K^0,s)$, $s$ a $D_{\\rm out}\\times D_{\\rm out}$ matrix, and $\\pi(ds\\mid y)\\propto\\pi(ds)\\,\\mathcal N(y;0,K^0\\otimes s+\\eta I)$; for $D_{\\rm out}=1$, $s\\overset d=\\prod_{\\ell=1}^{L}\\chi^2_{N_\\ell}/N_\\ell$."
    mapping: "paper $L=W_d\\cdots W_2W_2^\\top\\cdots W_d^\\top\\to s$ ($\\lambda$ for one output); $\\varpi,\\rho\\to\\pi(ds),\\pi(ds\\mid y)$; $G_{xx}\\to K^0$; $\\Gamma_\\lambda=(\\lambda K^0+\\eta)/\\eta$; $\\beta\\to1/\\eta$, $\\gamma=1$, $\\kappa=1/N$; depth $d=L+1$."
    equations: "Eqs. (5)-(7), (10)-(16) (matrix); (17)-(23) (scalar output); App. Eqs. (44)-(49)"
    role: master
  - paper: "2111.11954"
    result: r2
    statement: "At $\\eta\\to0$ (interchange with the average assumed) the mean is the min-norm interpolant $k^\\top(K^0)^{-1}y$, independent of $s$, and the covariance is the GP covariance times $\\mathbb E_\\pi s$; for $L=1$, $s\\mid y$ is matrix GIG, scalar: $\\pi(s\\mid y)\\propto s^{\\frac{N-P}2-1}e^{-\\frac12(Ns+P\\bar r/s)}$."
    mapping: "as r1; $Y^\\top G_{xx}^{-1}Y\\to P\\bar r$ for one output ($\\bar r=\\tfrac1Py^\\top(K^0)^{-1}y$); $\\mathrm{MGIG}_{n_2}(Y^\\top G_{xx}^{-1}Y,\\,n_1I,\\,\\tfrac{n_1-p}2)$, Eq. (30)."
    equations: "Eqs. (24)-(30), Sec. III-C"
    role: master
  - paper: "2406.03260"
    statement: "For a fully connected deep linear net with $D_{\\rm out}$ outputs and $\\min N_\\ell>D_{\\rm out}$, $\\mathrm{vec}f\\mid Q\\sim\\mathcal N(0,K^0\\otimes Q^{(L)})$ with $Q^{(L)}=(U_1\\cdots U_L)^\\top U_1\\cdots U_L$, $U_\\ell^\\top U_\\ell=Q_\\ell\\sim W_{D_{\\rm out}}(N_\\ell,I/N_\\ell)$ independent; the posterior predictive is the GP posterior at $K^0\\otimes Q^{(L)}$ mixed over $Q$ with law $\\propto\\mathcal N(y;0,K^0\\otimes Q^{(L)}+\\eta I)\\,\\mathcal Q_{L,N}(dQ)$."
    mapping: "paper $D\\to D_{\\rm out}$, $N_0\\to D$; $Q_\\ell\\to$ matrix $\\rho_\\ell$, $Q^{(L)}\\to s$; $K^0=X^\\top X/(N_0\\lambda^*)$ ($\\sigma_\\ell^2=1/\\lambda_\\ell$); $\\beta^{-1}\\to\\eta$, $\\gamma=1$; $\\Phi_\\beta=y^\\top(\\Sigma_{11}+\\eta)^{-1}y+\\log\\det(1+\\beta\\Sigma_{11})$."
    equations: "Prop. 1, Remark 3 Eq. (10); Prop. 6; Prop. 8 notation Eq. (9)"
    role: master
  - paper: "2406.03260"
    result: r2
    statement: "For a 1D convolutional deep linear net (periodic boundary, unit stride, one output, $\\min C_\\ell>D$), the prior is a Gaussian mixture whose covariance contracts the local covariance tensor with $T(Q_1,\\dots,Q_L)$, built from independent $D\\times D$ Wisharts $Q_\\ell\\sim W_D(C_\\ell,I/C_\\ell)$; the posterior predictive is the GP posterior at that kernel, mixed with…"
    mapping: "paper $N_0$ (input positions) $\\to D$, channels $C_\\ell\\to N_\\ell$; $T$ = backward recursion (15) with mask averages $\\tfrac1M\\sum_mT_m^\\top(\\cdot)T_m$; matrix over spatial position pairs; $\\eta=\\beta^{-1}$."
