  - paper: "2507.22095"
    result: r2
    statement: "Dependent heavy-tailed weights $W_{hj}=\\sqrt{V_j}N_{hj}$, $\\sum_jV_j\\to\\mathrm{ID}(a,\\rho)$, sequential $N_\\ell\\to\\infty$, a.s. invertible random limit kernel $\\mathbb K$: on the training inputs $f(X)\\mid\\mathcal D\\Rightarrow\\mathbb E_S\\,\\mathcal N(\\mathbb K(\\mathbb K+\\eta I)^{-1}y,\\ \\eta\\mathbb K(\\mathbb K+\\eta I)^{-1})$ per output, $dS\\propto\\prod_r\\mathcal N(y_r;0,\\mathbb K+\\eta I)\\,dP_{\\rm prior}$, $\\eta=\\frac12$."
    mapping: "Paper $d\\to P$, $n_\\ell\\to N_\\ell$, $n_{L+1}\\to D_{\\rm out}$; likelihood $e^{-\\sum_i\\Vert Z(x_i)-y_i\\Vert^2}$ gives $\\eta=\\frac12$; $L=2I+\\mathbb K^{-1}$, $\\lambda=2yL^{-1}$, $\\Lambda=I\\otimes L^{-1}$; the random matrix $\\mathbb K$ replaces $sK^0$; $\\kappa=0$ (likelihood not scaled with width)."
    role: extension
  - paper: "2507.22095"
    result: r1
    statement: "Prior: $f(X)\\Rightarrow\\mathrm{GM}(0,I_{D_{\\rm out}}\\otimes\\mathbb K^{(L+1)})$, $\\mathbb K^{(\\ell)}=C_B\\mathbf1\\mathbf1^\\top+C_W[a^{(\\ell-1)}\\mathbb E(\\varphi\\varphi^\\top\\mid\\mathbb K^{(\\ell-1)})+\\sum_jT_j\\varphi(\\zeta_j)\\varphi(\\zeta_j)^\\top]$, $T_j$ Poisson points of $\\rho^{(\\ell-1)}$; for $L\\ge2$ every order of the sequential limits gives this law if $\\varphi$ is bounded continuous, or polynomially bounded with finite Lévy measures."
    mapping: "$a^{(\\ell)}$ = drift (LLN part, the NNGP map), $\\rho^{(\\ell)}$ = Lévy measure (finitely many neurons keep $O(1)$ variance, so $\\mathbb K$ stays random); $C_W=\\sigma_w^2$, $C_B$ = bias variance; $\\rho\\equiv0$ gives $K^\\ell_{\\rm GP}$. This is the mixing prior $\\pi$ of S03."
    equations: "Thm 1 Eqs. (4.1)-(4.3) (quoted from [26], Lee et al. JMLR 2023, Thm 16)"
    role: extension
  - paper: "2507.22095"
