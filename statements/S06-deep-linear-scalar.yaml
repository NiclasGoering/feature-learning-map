disagreements:
  - {papers: ["2405.10761", "2012.04030"], note: "Fischer et al. claim their $P=\\alpha N$ kernel action exact at linear order; its linear rate (PDF Eq. 88) lacks the Wishart term $+\\frac{P+1}2\\ln\\det$, and its scalar projection gives $u-1=(r-1)/N$, missing the $O(\\alpha)$ renormalisation of Li–Sompolinsky Eq. 27. Kernel variables need the $N-P$ term. [verified]"}
