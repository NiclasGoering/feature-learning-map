  - paper: "2006.15191"
    result: r4
    statement: "Batch size, learning rate and optimiser shift $P_{\\rm OPT}(f|S)$ as second-order effects relative to the NNGP $P_B$ (CE/EP, Fig. 5); with 20% corrupted labels (MSE, $\\eta=0.002$, 50 test points) shared functions carry 99.3% of $P_B$ but only 24.3% of $P_{\\rm SGD}$, and $\\langle\\epsilon\\rangle_{\\rm SGD}=13.4\\%$ against 5.80% for the GP."
    mapping: "Bayes side NNGP; Fig. 5: 0-1 likelihood via EP ($\\beta\\to\\infty$); Fig. 6(c): Gaussian likelihood $\\eta=0.002$; SGD side $N=1024$, $L=2$; $|S|=10^4\\to P$."
    equations: "Secs. 5.1-5.2, Fig. 5; Sec. 6, Fig. 6(b)-(c); Fig. 19"
    role: check
