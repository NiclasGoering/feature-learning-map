    note: 'S13 integrates out eigenmodes of the data covariance to renormalise a ridge of a Gaussian-process predictor. Sense (d) coarse-grains configurations $v\to h$ by a stochastic map and tracks the data law; no ridge, predictor or eigenmode cutoff appears in any member.'
