    relation: unrelated
    note: 'Gordon first bottleneck transition: a supercritical pitchfork of the symmetric encoder, $m\propto\sqrt{\beta-\beta_{c,1}}$ (Eq. (33) [PDF C11]). Same Landau form as S09, but of the bottleneck Lagrangian in the trade-off $\beta$, not a network free energy $\tilde F$.'
  - target: S10
    relation: unrelated
    note: 'RG-on-data objects are conditional laws $p(h|v)$ of the data and their information content ($I(v;h)$ is a compression rate). S10 is a prior volume $P(f)\lesssim2^{-a\mathcal K(f)+b}$ over functions of a network; no member computes a prior volume or complexity bound.'
  - target: S14
    relation: unrelated
    note: 'S14 is supervised teacher-student inference on Gaussian inputs, error $\rho_0-q^*$ over overlaps. RG-on-data is unsupervised: the object is the input law and a map or a hierarchical generative model (Bény); no teacher, Bayes-optimal error or overlap matrix is computed.'
  - target: S11
    relation: unrelated
    note: 'Mehta-Schwab $D_{\rm KL}(p\Vert p_\Lambda)$ is the population log-loss of an RBM density model ($L_P\to D_{\rm KL}+$ const in S11), but no member forms a posterior or an evidence law $\lambda_{\rm LC}\log P$; RG free energies are those of the data law.'
  - target: S01
