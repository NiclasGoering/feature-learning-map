  - {target: S02, relation: reproduces, note: 'S02''s cumulants are this recursion''s solution: critical one input, $\mathrm{Var}\,K^L/(K^L_{\rm GP})^2=\nu L/N$ with $\nu=c_\varphi$ (5, 2, $\frac23$); deep linear gives $2\sum_\ell N_\ell^{-1}$, S02''s $\mathrm{Var}\ln s$ at first order.'}
  - {target: S08, relation: extends, note: 'S08''s tilts contract the targets with the prior kernel covariance. One hidden layer: $\mathrm{Cov}_0(\varphi\varphi^\top,\cdot)=T/\sigma^4$. Deep: $\mathrm{Cov}(K^\ell,K^L)=\mathrm{Cov}\,K^\ell\,(\chi_L\cdots\chi_{\ell+1})^\top$, forward term $\chi_\ell[\delta K^{\ell-1}]$. Prior side only.'}
  - {target: S04, relation: reproduces, note: 'Quadratic expansion of $\sum_\ell\gamma_\ell J_\ell$ about its minimiser, $J_\ell\simeq\frac12\delta K^\top T_\ell^{-1}\delta K$, $\gamma_\ell=N_\ell/N$, gives the covariance recursion. The data term $\kappa E$ is absent. Beyond the members: algebra.'}
  - {target: S03, relation: extends, note: 'S03''s mixing variable is the random kernel of a linear network, $K^L=sK^0$, $\mathrm{Var}\,s\simeq2\sum_\ell N_\ell^{-1}$. This flow gives the first-order prior covariance of $K^L$ for any $\varphi$; S03 adds the evidence tilt.'}
