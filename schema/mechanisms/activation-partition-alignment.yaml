slug: activation-partition-alignment
label: "activation partition alignment"
types: [T6]
desc: "In a piecewise linear network started near zero output, the first layer learns faster than the rest (upstream initialisation) and each neuron's active halfspace rotates to a data-dependent direction while the output stays near zero. The kernel changes through the activation pattern, with little movement in parameter space."
