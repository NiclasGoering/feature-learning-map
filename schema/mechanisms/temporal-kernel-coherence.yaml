slug: temporal-kernel-coherence      # equals the file name
label: "temporal kernel coherence"   # 1 to 4 words, lowercase except names
types: [T5]
desc: "In a weight-shared recurrent network, a strong enough learning signal makes the incoherent minimum of the kernel objective unstable, and the representation kernel acquires off-diagonal correlations between timesteps. The kernel eigenvectors align with the task, which an unrolled network with independent layers cannot do."
