slug: teacher-equivalent-collapse
label: "Teacher-equivalent collapse"
types: [T4]
desc: "A law uniform on the interpolating parameters concentrates on the set of parameters that compute the teacher function once the number of samples exceeds the dimension gap between the parameter space and that set. The collapse is onto a lower-dimensional analytic set, not onto a few atoms."
