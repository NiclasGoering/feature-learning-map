slug: feature-unlearning
label: "feature unlearning"
types: [T6]
desc: "After first-layer weights align with the latent target subspace, the readout weights keep growing towards the scale needed to interpolate noise. The overlap of the first-layer weights with the latent space then decays to its random-initialisation size and the predictor returns to a data-independent kernel one."
